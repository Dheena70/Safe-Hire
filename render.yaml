services:
  - type: web
    name: safe-hire
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt && python backend/init_db.py"
    startCommand: "gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120"
    plan: free
    envVars:
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.9
